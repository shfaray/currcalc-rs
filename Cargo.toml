[package]
name = "currcalc"
version = "0.1.0"
edition = "2024"
description = "Fast CLI currency converter backed by frankfurter.dev"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
